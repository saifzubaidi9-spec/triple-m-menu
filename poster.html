<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120D0A" />
  <title>Triple M — Scan for the Menu</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Meant for a counter display or print — one centered composition,
       scaling to fill whatever screen or paper it lands on. */
    .stage {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vh, 40px);
      padding: clamp(24px, 6vw, 64px);
      text-align: center;
    }
    .mark { flex-shrink: 0; }
    .eyebrow {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream-faint);
      margin: 0;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin: 0;
      text-wrap: balance;
    }
    .qr-card {
      background: var(--card-paper);
      border-radius: 28px;
      padding: clamp(18px, 3vw, 28px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
    }
    .qr-card img {
      display: block;
      width: clamp(200px, 34vw, 340px);
      height: auto;
    }
    .hint {
      font-size: 1rem;
      color: var(--cream-dim);
      max-width: 30ch;
      margin: 0;
    }
    .url-fallback {
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--cream-faint);
      letter-spacing: 0.01em;
      word-break: break-all;
      max-width: 40ch;
    }
  </style>
</head>
