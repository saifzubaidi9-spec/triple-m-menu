<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120D0A" />
  <title>Triple M — Menu</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .page {
      max-width: 430px;
      margin-inline: auto;
      min-height: 100dvh;
      padding: 28px 20px 64px;
    }
    .eyebrow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .eyebrow {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.6875rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cream-faint);
    }
    .mark { flex-shrink: 0; }
    h1.wordmark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 2.1rem;
      letter-spacing: -0.01em;
      margin: 0 0 4px;
      text-wrap: balance;
    }
    .tagline {
      font-size: 0.8125rem;
      color: var(--cream-dim);
      margin: 0 0 22px;
      line-height: 1.5;
    }
    .switcher {
      position: sticky;
      top: 14px;
      z-index: 5;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 999px;
      margin-bottom: 22px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .tab {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--cream-dim);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 11px 0;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .tab[aria-selected="true"] {
      background: var(--amber);
      color: var(--on-amber);
    }
    .panel-note {
      font-size: 0.75rem;
      color: var(--cream-faint);
      margin: -12px 0 16px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .tile {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      overflow: hidden;
    }
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .info { flex: 1; min-width: 0; }
    .info-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .info-top h3 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.0625rem;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .desc {
      font-size: 0.8125rem;
      line-height: 1.4;
      color: var(--cream-faint);
      margin: 0;
    }
    .badge {
      flex-shrink: 0;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .badge-new { color: var(--amber); background: rgba(232, 163, 61, 0.14); }
    .badge-bestseller { color: var(--berry); background: rgba(232, 145, 110, 0.14); }
    .badge-veggie { color: var(--matcha); background: rgba(168, 198, 134, 0.14); }
    .price {
      flex-shrink: 0;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.9375rem;
      font-variant-numeric: tabular-nums;
    }
    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.6;
      color: var(--cream-faint);
      padding: 0 12px;
    }
    .loading {
      text-align: center;
      color: var(--cream-faint);
      font-size: 0.875rem;
      padding: 40px 0;
    }
    @media (prefers-reduced-motion: no-preference) {
      .item {
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--i, 0) * 45ms + 80ms);
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="eyebrow-row">
      <span class="eyebrow">Triple M · Campus Kiosk</span>
      <svg class="mark" width="30" height="13.3" viewBox="0 0 108 48" fill="none" aria-hidden="true">
        <path d="M6 38 L14 10 L22 30 L30 10 L38 38 L46 10 L54 30 L62 10 L70 38 L78 10 L86 30 L94 10 L102 38"
          stroke="#E8A33D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h1 class="wordmark">Menu</h1>
    <p class="tagline">Kiosk, Building C · pickup only, pay at the counter</p>

    <div class="switcher" id="switcher" role="tablist" aria-label="Menu category"></div>
    <div id="panels">
      <p class="loading">Loading menu…</p>
    </div>

    <footer>Triple M · Building C, university campus<br />Menu updates weekly</footer>
  </div>

  <script>
    var BADGE_LABELS = { new: 'New', bestseller: 'Bestseller', veggie: 'Veggie' };

    function renderItem(item, index) {
      var art = document.createElement('article');
      art.className = 'item';
      art.style.setProperty('--i', index);

      var tile = document.createElement('div');
      tile.className = 'tile';
      if (item.image) {
        var img = document.createElement('img');
        img.src = item.image;
        img.alt = '';
        img.loading = 'lazy';
        tile.appendChild(img);
      } else {
        tile.style.background = 'linear-gradient(135deg, ' + item.tint[0] + ', ' + item.tint[1] + ')';
        tile.textContent = item.emoji;
      }
      art.appendChild(tile);

      var info = document.createElement('div');
      info.className = 'info';
      var top = document.createElement('div');
      top.className = 'info-top';
      var h3 = document.createElement('h3');
      h3.textContent = item.name;
      top.appendChild(h3);
      if (item.badge) {
        var badge = document.createElement('span');
        badge.className = 'badge badge-' + item.badge;
        badge.textContent = BADGE_LABELS[item.badge] || item.badge;
        top.appendChild(badge);
      }
      info.appendChild(top);
      var desc = document.createElement('p');
      desc.className = 'desc';
      desc.textContent = item.description;
      info.appendChild(desc);
      art.appendChild(info);

      var price = document.createElement('div');
      price.className = 'price';
      price.textContent = '$' + Number(item.price).toFixed(2);
      art.appendChild(price);

      return art;
    }

    function render(data) {
      var switcher = document.getElementById('switcher');
      var panelsWrap = document.getElementById('panels');
      panelsWrap.innerHTML = '';

      data.categories.forEach(function (cat, ci) {
        var tab = document.createElement('button');
        tab.className = 'tab';
        tab.type = 'button';
        tab.setAttribute('role', 'tab');
        tab.id = 'tab-' + cat.id;
        tab.setAttribute('aria-selected', ci === 0 ? 'true' : 'false');
        tab.setAttribute('aria-controls', 'panel-' + cat.id);
        tab.tabIndex = ci === 0 ? 0 : -1;
        tab.dataset.tab = cat.id;
        tab.textContent = cat.label;
        switcher.appendChild(tab);

        var panel = document.createElement('section');
        panel.id = 'panel-' + cat.id;
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('aria-labelledby', 'tab-' + cat.id);
        if (ci !== 0) panel.hidden = true;

        var note = document.createElement('p');
        note.className = 'panel-note';
        note.textContent = cat.note;
        panel.appendChild(note);

        var list = document.createElement('div');
        list.className = 'list';
        data.items
          .filter(function (it) { return it.category === cat.id; })
          .forEach(function (it, i) { list.appendChild(renderItem(it, i)); });
        panel.appendChild(list);

        panelsWrap.appendChild(panel);
      });

      var tabs = switcher.querySelectorAll('.tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.setAttribute('aria-selected', 'false');
            t.tabIndex = -1;
          });
          tab.setAttribute('aria-selected', 'true');
          tab.tabIndex = 0;
          panelsWrap.querySelectorAll('section').forEach(function (p) {
            p.hidden = p.id !== 'panel-' + tab.dataset.tab;
          });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    fetch('./menu-data.json', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(render)
      .catch(function () {
        document.getElementById('panels').innerHTML =
          '<p class="loading">Menu unavailable right now — please ask at the counter.</p>';
      });
  </script>
</body>
</html>
