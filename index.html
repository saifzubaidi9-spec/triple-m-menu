<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120D0A" />
  <title>Triple M — Menu</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .page {
      max-width: 430px;
      margin-inline: auto;
      min-height: 100dvh;
      padding: 28px 20px 64px;
    }
    .eyebrow-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .eyebrow {
      flex: 1;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.6875rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cream-faint);
    }
    [dir="rtl"] .eyebrow,
    [dir="rtl"] .badge {
      letter-spacing: 0;
      text-transform: none;
    }
    .mark { flex-shrink: 0; }
    .lang-btn {
      flex-shrink: 0;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface-hi);
      color: var(--cream);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.7rem;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang-btn:hover { background: var(--surface); }
    h1.wordmark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 2.1rem;
      letter-spacing: -0.01em;
      margin: 0 0 4px;
      text-wrap: balance;
    }
    [dir="rtl"] h1.wordmark { letter-spacing: 0; }
    .tagline {
      font-size: 0.8125rem;
      color: var(--cream-dim);
      margin: 0 0 22px;
      line-height: 1.5;
    }
    .switcher {
      position: sticky;
      top: 14px;
      z-index: 5;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 999px;
      margin-bottom: 22px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .tab {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--cream-dim);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 11px 0;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .tab[aria-selected="true"] {
      background: var(--amber);
      color: var(--on-amber);
    }
    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      margin-inline-start: 5px;
      border-radius: 999px;
      font-size: 0.625rem;
      font-weight: 700;
      vertical-align: middle;
      background: var(--amber);
      color: var(--on-amber);
    }
    .tab[aria-selected="true"] .tab-badge {
      background: var(--on-amber);
      color: var(--amber);
    }
    .tab-badge[hidden] { display: none; }
    .panel-note {
      font-size: 0.75rem;
      color: var(--cream-faint);
      margin: -12px 0 16px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .tile {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      overflow: hidden;
    }
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .info { flex: 1; min-width: 0; }
    .info-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .info-top h3 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.0625rem;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .desc {
      font-size: 0.8125rem;
      line-height: 1.4;
      color: var(--cream-faint);
      margin: 0;
    }
    .badge {
      flex-shrink: 0;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .badge-new { color: var(--amber); background: rgba(232, 163, 61, 0.14); }
    .badge-bestseller { color: var(--berry); background: rgba(232, 145, 110, 0.14); }
    .badge-veggie { color: var(--matcha); background: rgba(168, 198, 134, 0.14); }
    .price {
      flex-shrink: 0;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.9375rem;
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }
    .add-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--amber);
      color: var(--on-amber);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }
    .add-btn:active { transform: scale(0.92); }
    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.6;
      color: var(--cream-faint);
      padding: 0 12px;
    }
    .loading {
      text-align: center;
      color: var(--cream-faint);
      font-size: 0.875rem;
      padding: 40px 0;
    }

    /* ── Order tab ─────────────────────────────────────────────── */
    .cart-line {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }
    .cart-line-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cart-line-name {
      flex: 1;
      min-width: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cart-remove-btn {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--surface-hi);
      border: 1px solid var(--line);
      color: var(--cream-dim);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .cart-note-input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.8125rem;
      color: var(--cream);
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 11px;
    }
    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 4px 6px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.95rem;
    }
    .order-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .order-form input[type="text"] {
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--cream);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
    }
    .order-error {
      color: var(--danger);
      font-size: 0.8rem;
      margin: 0;
    }
    .order-submit-btn {
      appearance: none;
      border: none;
      background: var(--amber);
      color: var(--on-amber);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 15px;
      border-radius: 999px;
      cursor: pointer;
    }
    .order-submit-btn:disabled { opacity: 0.6; cursor: default; }
    .confirmation {
      text-align: center;
      padding: 34px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .confirmation-heading {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.6rem;
      margin: 6px 0 0;
    }
    .confirmation-id {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--amber);
      letter-spacing: 0.05em;
      margin: 0;
      direction: ltr;
    }
    .confirmation-body {
      font-size: 0.875rem;
      color: var(--cream-dim);
      max-width: 32ch;
      margin: 0 0 14px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .item, .cart-line {
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--i, 0) * 45ms + 80ms);
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="eyebrow-row">
      <span class="eyebrow" id="eyebrow">Triple M · Campus Kiosk</span>
      <svg class="mark" width="30" height="13.3" viewBox="0 0 108 48" fill="none" aria-hidden="true">
        <path d="M6 38 L14 10 L22 30 L30 10 L38 38 L46 10 L54 30 L62 10 L70 38 L78 10 L86 30 L94 10 L102 38"
          stroke="#E8A33D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <button class="lang-btn" id="lang-toggle" type="button">العربية</button>
    </div>
    <h1 class="wordmark" id="wordmark">Menu</h1>
    <p class="tagline" id="tagline">Kiosk, Building C · pickup only, pay at the counter</p>

    <div class="switcher" id="switcher" role="tablist" aria-label="Menu category"></div>
    <div id="panels">
      <p class="loading" id="loading-text">Loading menu…</p>
    </div>

    <footer>
      <span id="footer-line1">Triple M · Building C, university campus</span><br />
      <span id="footer-line2">Menu updates weekly</span>
    </footer>
  </div>

  <script>
    var ORDER_TAB_ID = '__order__';

    var STRINGS = {
      en: {
        eyebrow: 'Triple M · Campus Kiosk',
        wordmark: 'Menu',
        tagline: 'Kiosk, Building C · pickup only, pay at the counter',
        loading: 'Loading menu…',
        unavailable: 'Menu unavailable right now — please ask at the counter.',
        footer1: 'Triple M · Building C, university campus',
        footer2: 'Menu updates weekly',
        toggleLabel: 'العربية',
        orderTab: 'Order',
        emptyCart: 'Your order is empty. Add items from the menu to get started.',
        notePlaceholder: 'Add a note — e.g. no onion',
        remove: 'Remove',
        total: 'Total',
        namePlaceholder: 'Your name',
        numberPlaceholder: 'Student number',
        placeOrder: 'Place order',
        sending: 'Sending…',
        missingFields: 'Please enter your name and student number.',
        submitFailed: 'Couldn’t send your order — please try again.',
        orderSent: 'Order sent!',
        orderSentBody: 'We’ll have it ready soon — show this number at the counter.',
        newOrder: 'Start a new order',
        addToOrder: 'Add to order'
      },
      ar: {
        eyebrow: 'تريبل إم · كشك الحرم الجامعي',
        wordmark: 'القائمة',
        tagline: 'الكشك، مبنى C · استلام فقط، الدفع عند الكاونتر',
        loading: 'جارٍ تحميل القائمة…',
        unavailable: 'القائمة غير متاحة حالياً — يرجى السؤال عند الكاونتر.',
        footer1: 'تريبل إم · مبنى C، الحرم الجامعي',
        footer2: 'تُحدَّث القائمة أسبوعياً',
        toggleLabel: 'English',
        orderTab: 'طلبي',
        emptyCart: 'طلبك فارغ. أضف أصنافاً من القائمة للبدء.',
        notePlaceholder: 'أضف ملاحظة — مثال: بدون بصل',
        remove: 'إزالة',
        total: 'الإجمالي',
        namePlaceholder: 'الاسم',
        numberPlaceholder: 'الرقم الجامعي',
        placeOrder: 'إرسال الطلب',
        sending: 'جارٍ الإرسال…',
        missingFields: 'يرجى إدخال الاسم والرقم الجامعي.',
        submitFailed: 'تعذر إرسال الطلب — حاول مرة أخرى.',
        orderSent: 'تم إرسال الطلب!',
        orderSentBody: 'سيكون جاهزاً قريباً — أظهر هذا الرقم عند الكاونتر.',
        newOrder: 'بدء طلب جديد',
        addToOrder: 'أضف إلى الطلب'
      }
    };
    var BADGE_LABELS = {
      en: { new: 'New', bestseller: 'Bestseller', veggie: 'Veggie' },
      ar: { new: 'جديد', bestseller: 'الأكثر مبيعاً', veggie: 'نباتي' }
    };

    var RAW_BASE = 'https://raw.githubusercontent.com/saifzubaidi9-spec/triple-m-menu/master/';

    // Uploaded photos are stored as relative paths ("images/x.jpg") in
    // menu-data.json; resolve them against GitHub raw content so a new
    // photo shows up without needing a Netlify deploy.
    function resolveImageUrl(path) {
      if (!path) return path;
      if (/^https?:\/\//.test(path)) return path;
      return RAW_BASE + path.replace(/^\.\//, '');
    }

    var menuData = null;
    var activeCategory = null;
    var currentLang = localStorage.getItem('tm_lang') === 'ar' ? 'ar' : 'en';

    // ── Order state ──────────────────────────────────────────────────
    var nextCartId = 1;
    var cart = loadCart();
    var studentName = '';
    var studentNumber = '';
    var submitting = false;
    var submitError = '';
    var lastOrder = null;

    function loadCart() {
      try {
        var parsed = JSON.parse(localStorage.getItem('tm_cart') || '[]');
        parsed.forEach(function (l) { if (l.cartId >= nextCartId) nextCartId = l.cartId + 1; });
        return parsed;
      } catch (e) {
        return [];
      }
    }
    function saveCart() {
      localStorage.setItem('tm_cart', JSON.stringify(cart));
    }

    function renderItem(item, index) {
      var art = document.createElement('article');
      art.className = 'item';
      art.style.setProperty('--i', index);

      var tile = document.createElement('div');
      tile.className = 'tile';
      if (item.image) {
        var img = document.createElement('img');
        img.src = resolveImageUrl(item.image);
        img.alt = '';
        img.loading = 'lazy';
        tile.appendChild(img);
      } else {
        tile.style.background = 'linear-gradient(135deg, ' + item.tint[0] + ', ' + item.tint[1] + ')';
        tile.textContent = item.emoji;
      }
      art.appendChild(tile);

      var info = document.createElement('div');
      info.className = 'info';
      var top = document.createElement('div');
      top.className = 'info-top';
      var h3 = document.createElement('h3');
      h3.textContent = item.name[currentLang] || item.name.en;
      top.appendChild(h3);
      if (item.badge) {
        var badge = document.createElement('span');
        badge.className = 'badge badge-' + item.badge;
        badge.textContent = BADGE_LABELS[currentLang][item.badge] || item.badge;
        top.appendChild(badge);
      }
      info.appendChild(top);
      var desc = document.createElement('p');
      desc.className = 'desc';
      desc.textContent = item.description[currentLang] || item.description.en;
      info.appendChild(desc);
      art.appendChild(info);

      var price = document.createElement('div');
      price.className = 'price';
      price.textContent = 'JD ' + Number(item.price).toFixed(2);
      art.appendChild(price);

      if (orderingEnabled()) {
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'add-btn';
        addBtn.setAttribute('aria-label', STRINGS[currentLang].addToOrder);
        addBtn.textContent = '+';
        addBtn.addEventListener('click', function () {
          cart.push({ cartId: nextCartId++, itemId: item.id, notes: '' });
          saveCart();
          var badgeEl = document.getElementById('order-badge');
          if (badgeEl) {
            badgeEl.hidden = false;
            badgeEl.textContent = cart.length;
          }
        });
        art.appendChild(addBtn);
      }

      return art;
    }

    // ── Order tab rendering ─────────────────────────────────────────
    function resolveCartLine(line) {
      var item = menuData.items.find(function (it) { return it.id === line.itemId; });
      if (!item) return null;
      return {
        cartId: line.cartId,
        itemId: line.itemId,
        notes: line.notes,
        name: item.name[currentLang] || item.name.en,
        price: item.price
      };
    }

    function renderCartLine(line) {
      var row = document.createElement('div');
      row.className = 'cart-line';

      var top = document.createElement('div');
      top.className = 'cart-line-top';
      var name = document.createElement('span');
      name.className = 'cart-line-name';
      name.textContent = line.name;
      var price = document.createElement('span');
      price.className = 'price';
      price.textContent = 'JD ' + line.price.toFixed(2);
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'cart-remove-btn';
      removeBtn.setAttribute('aria-label', STRINGS[currentLang].remove);
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', function () {
        cart = cart.filter(function (l) { return l.cartId !== line.cartId; });
        saveCart();
        render();
      });
      top.appendChild(name);
      top.appendChild(price);
      top.appendChild(removeBtn);
      row.appendChild(top);

      var noteInput = document.createElement('input');
      noteInput.type = 'text';
      noteInput.className = 'cart-note-input';
      noteInput.placeholder = STRINGS[currentLang].notePlaceholder;
      noteInput.value = line.notes || '';
      noteInput.addEventListener('input', function () {
        var target = cart.find(function (l) { return l.cartId === line.cartId; });
        if (target) { target.notes = noteInput.value; saveCart(); }
      });
      row.appendChild(noteInput);

      return row;
    }

    function renderOrderForm() {
      var form = document.createElement('div');
      form.className = 'order-form';

      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.dir = 'auto';
      nameInput.placeholder = STRINGS[currentLang].namePlaceholder;
      nameInput.value = studentName;
      nameInput.addEventListener('input', function () { studentName = nameInput.value; });
      form.appendChild(nameInput);

      var numberInput = document.createElement('input');
      numberInput.type = 'text';
      numberInput.placeholder = STRINGS[currentLang].numberPlaceholder;
      numberInput.value = studentNumber;
      numberInput.addEventListener('input', function () { studentNumber = numberInput.value; });
      form.appendChild(numberInput);

      if (submitError) {
        var err = document.createElement('p');
        err.className = 'order-error';
        err.textContent = submitError;
        form.appendChild(err);
      }

      var submitBtn = document.createElement('button');
      submitBtn.type = 'button';
      submitBtn.className = 'order-submit-btn';
      submitBtn.disabled = submitting;
      submitBtn.textContent = submitting ? STRINGS[currentLang].sending : STRINGS[currentLang].placeOrder;
      submitBtn.addEventListener('click', submitOrder);
      form.appendChild(submitBtn);

      return form;
    }

    function renderConfirmation() {
      var wrap = document.createElement('div');
      wrap.className = 'confirmation';

      var heading = document.createElement('h2');
      heading.className = 'confirmation-heading';
      heading.textContent = STRINGS[currentLang].orderSent;
      wrap.appendChild(heading);

      var idLine = document.createElement('p');
      idLine.className = 'confirmation-id';
      idLine.textContent = '#' + lastOrder.id;
      wrap.appendChild(idLine);

      var body = document.createElement('p');
      body.className = 'confirmation-body';
      body.textContent = STRINGS[currentLang].orderSentBody;
      wrap.appendChild(body);

      var newOrderBtn = document.createElement('button');
      newOrderBtn.type = 'button';
      newOrderBtn.className = 'order-submit-btn';
      newOrderBtn.textContent = STRINGS[currentLang].newOrder;
      newOrderBtn.addEventListener('click', function () {
        lastOrder = null;
        render();
      });
      wrap.appendChild(newOrderBtn);

      return wrap;
    }

    function renderOrderPanel() {
      var wrap = document.createElement('div');

      if (lastOrder) {
        wrap.appendChild(renderConfirmation());
        return wrap;
      }

      var resolvedLines = cart.map(resolveCartLine).filter(Boolean);

      if (resolvedLines.length === 0) {
        var empty = document.createElement('p');
        empty.className = 'loading';
        empty.textContent = STRINGS[currentLang].emptyCart;
        wrap.appendChild(empty);
        return wrap;
      }

      var list = document.createElement('div');
      list.className = 'list';
      resolvedLines.forEach(function (line, i) {
        var row = renderCartLine(line);
        row.style.setProperty('--i', i);
        list.appendChild(row);
      });
      wrap.appendChild(list);

      var totalRow = document.createElement('div');
      totalRow.className = 'order-total-row';
      var totalLabel = document.createElement('span');
      totalLabel.textContent = STRINGS[currentLang].total;
      var totalValue = document.createElement('span');
      totalValue.className = 'price';
      var total = resolvedLines.reduce(function (sum, l) { return sum + l.price; }, 0);
      totalValue.textContent = 'JD ' + total.toFixed(2);
      totalRow.appendChild(totalLabel);
      totalRow.appendChild(totalValue);
      wrap.appendChild(totalRow);

      wrap.appendChild(renderOrderForm());

      return wrap;
    }

    function submitOrder() {
      var name = studentName.trim();
      var number = studentNumber.trim();
      if (!name || !number) {
        submitError = STRINGS[currentLang].missingFields;
        render();
        return;
      }

      var resolvedLines = cart.map(resolveCartLine).filter(Boolean);
      var payload = {
        studentName: name,
        studentNumber: number,
        items: resolvedLines.map(function (l) {
          return { itemId: l.itemId, name: l.name, price: l.price, notes: l.notes };
        })
      };

      submitting = true;
      submitError = '';
      render();

      fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || 'Failed'); });
          return res.json();
        })
        .then(function (data) {
          lastOrder = { id: data.id, total: data.total };
          cart = [];
          saveCart();
          studentName = '';
          studentNumber = '';
          submitting = false;
          render();
        })
        .catch(function () {
          submitting = false;
          submitError = STRINGS[currentLang].submitFailed;
          render();
        });
    }

    // ── Main render ──────────────────────────────────────────────────
    function orderingEnabled() {
      return !!menuData && menuData.orderingEnabled !== false;
    }

    function render() {
      if (!menuData) return;
      if (!activeCategory) activeCategory = menuData.categories[0].id;
      if (activeCategory === ORDER_TAB_ID && !orderingEnabled()) {
        activeCategory = menuData.categories[0].id;
      }

      var switcher = document.getElementById('switcher');
      var panelsWrap = document.getElementById('panels');
      switcher.innerHTML = '';
      panelsWrap.innerHTML = '';

      menuData.categories.forEach(function (cat) {
        var isActive = cat.id === activeCategory;

        var tab = document.createElement('button');
        tab.className = 'tab';
        tab.type = 'button';
        tab.setAttribute('role', 'tab');
        tab.id = 'tab-' + cat.id;
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
        tab.setAttribute('aria-controls', 'panel-' + cat.id);
        tab.tabIndex = isActive ? 0 : -1;
        tab.dataset.tab = cat.id;
        tab.textContent = cat.label[currentLang] || cat.label.en;
        tab.addEventListener('click', function () {
          activeCategory = cat.id;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        switcher.appendChild(tab);

        var panel = document.createElement('section');
        panel.id = 'panel-' + cat.id;
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('aria-labelledby', 'tab-' + cat.id);
        if (!isActive) panel.hidden = true;

        var note = document.createElement('p');
        note.className = 'panel-note';
        note.textContent = cat.note[currentLang] || cat.note.en;
        panel.appendChild(note);

        var list = document.createElement('div');
        list.className = 'list';
        menuData.items
          .filter(function (it) { return it.category === cat.id && !it.hidden; })
          .forEach(function (it, i) { list.appendChild(renderItem(it, i)); });
        panel.appendChild(list);

        panelsWrap.appendChild(panel);
      });

      // Order tab — a cart view, not a menu category. Admin can switch
      // ordering off entirely (e.g. kitchen too busy to take more).
      if (orderingEnabled()) {
        var isOrderActive = activeCategory === ORDER_TAB_ID;
        var orderTab = document.createElement('button');
        orderTab.className = 'tab';
        orderTab.type = 'button';
        orderTab.setAttribute('role', 'tab');
        orderTab.id = 'tab-order';
        orderTab.setAttribute('aria-selected', isOrderActive ? 'true' : 'false');
        orderTab.setAttribute('aria-controls', 'panel-order');
        orderTab.tabIndex = isOrderActive ? 0 : -1;
        orderTab.addEventListener('click', function () {
          activeCategory = ORDER_TAB_ID;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        var orderTabLabel = document.createElement('span');
        orderTabLabel.textContent = STRINGS[currentLang].orderTab;
        orderTab.appendChild(orderTabLabel);
        var badge = document.createElement('span');
        badge.className = 'tab-badge';
        badge.id = 'order-badge';
        badge.textContent = cart.length;
        badge.hidden = cart.length === 0;
        orderTab.appendChild(badge);
        switcher.appendChild(orderTab);

        var orderPanel = document.createElement('section');
        orderPanel.id = 'panel-order';
        orderPanel.setAttribute('role', 'tabpanel');
        orderPanel.setAttribute('aria-labelledby', 'tab-order');
        if (!isOrderActive) orderPanel.hidden = true;
        orderPanel.appendChild(renderOrderPanel());
        panelsWrap.appendChild(orderPanel);
      }
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('tm_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      var s = STRINGS[lang];
      document.getElementById('eyebrow').textContent = s.eyebrow;
      document.getElementById('wordmark').textContent = s.wordmark;
      document.getElementById('tagline').textContent = s.tagline;
      document.getElementById('lang-toggle').textContent = s.toggleLabel;
      document.getElementById('footer-line1').textContent = s.footer1;
      document.getElementById('footer-line2').textContent = s.footer2;
      var loadingEl = document.getElementById('loading-text');
      if (loadingEl) loadingEl.textContent = s.loading;

      render();
    }

    document.getElementById('lang-toggle').addEventListener('click', function () {
      applyLanguage(currentLang === 'en' ? 'ar' : 'en');
    });

    applyLanguage(currentLang);

    // Fetched straight from GitHub, not the Netlify-deployed copy: admin
    // saves are then live immediately with no Netlify deploy (and no
    // deploy credit) needed for ordinary menu edits. Falls back to the
    // deployed copy if GitHub is unreachable.
    var RAW_MENU_URL =
      'https://raw.githubusercontent.com/saifzubaidi9-spec/triple-m-menu/master/menu-data.json?t=' + Date.now();

    fetch(RAW_MENU_URL, { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('raw fetch failed'); return res.json(); })
      .catch(function () {
        return fetch('./menu-data.json', { cache: 'no-store' }).then(function (res) { return res.json(); });
      })
      .then(function (data) {
        menuData = data;
        render();
      })
      .catch(function () {
        document.getElementById('panels').innerHTML =
          '<p class="loading">' + STRINGS[currentLang].unavailable + '</p>';
      });
  </script>
</body>
</html>
