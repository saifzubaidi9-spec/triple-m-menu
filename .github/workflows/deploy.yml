name: Deploy to Netlify

on:
  push:
    branches: [master]
    # Menu edits (data + photos) are fetched straight from GitHub raw
    # content at runtime and don't need a rebuild — only redeploy for
    # actual site-code changes. Netlify's Free plan charges 15 credits
    # per production deploy, so this matters: admin saves used to burn
    # a deploy every time for no real reason.
    paths-ignore:
      - 'menu-data.json'
      - 'images/**'
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install function dependencies
        run: npm install
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --dir=. --message "Deploy from GitHub $GITHUB_SHA"
